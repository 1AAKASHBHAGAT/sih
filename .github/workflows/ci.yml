name: SIH Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-tests:
    name: Backend Pytest & Schema Migration Suite
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "true"
      PYTHONPATH: "."

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify Alembic Schema Migrations
        working-directory: ./backend
        run: |
          python -m alembic upgrade head

      - name: Execute Pytest Suite (Offline & Fast Mocks)
        working-directory: ./backend
        run: |
          python -m pytest tests/ -v

  frontend-build-and-test:
    name: Frontend Vitest & Vite Build Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install

      - name: Run Vitest Component Unit Tests
        working-directory: ./frontend
        run: |
          npm test

      - name: Build Production Web App Bundle
        working-directory: ./frontend
        run: |
          npm run build
