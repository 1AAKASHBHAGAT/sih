name: SIH Platform CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-tests:
    name: Backend Pytest & Schema Migration Suite
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: "true"
      PYTHONPATH: "."

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify Alembic Schema Migrations
        working-directory: ./backend
        run: |
          python -m alembic upgrade head

      - name: Execute Pytest Suite (Offline & Fast Mocks)
        working-directory: ./backend
        run: |
          python -m pytest tests/ -v

  frontend-build-and-test:
    name: Frontend Vitest & Vite Build Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm install

      - name: Run Vitest Component Unit Tests
        working-directory: ./frontend
        run: |
          npx vitest run

      - name: Build Production Web App Bundle
        working-directory: ./frontend
        run: |
          npm run build

  render-cd-deploy:
    name: Render Backend Continuous Deployment (CD)
    needs: [backend-tests, frontend-build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Verify & Trigger Render Production Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "=================================================="
          echo "🟢 CI/CD Test Pipeline Completed Successfully!"
          echo "=================================================="
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "🚀 Triggering Render Production Deploy Hook..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "ℹ️ Render Auto-Deploy on Git Push is active for repository 1AAKASHBHAGAT/sih master branch."
          fi
